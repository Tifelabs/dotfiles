# Font
font_family      JetBrains Mono
font_size        13.0

# Transparency and blur
background_opacity 0.85
background_blur 30

# macOS specific
macos_titlebar_color background
macos_option_as_alt yes

# Window settings
initial_window_width  1200
initial_window_height 800
remember_window_size  yes
hide_window_decorations titlebar-only

# Gruvbox-Solarized Hybrid Theme
background            #1d2021
foreground            #ebdbb2
cursor                #93a1a1
selection_background  #504945
selection_foreground  #ebdbb2

# Black
color0   #282828
color8   #928374

# Red
color1   #cc241d
color9   #fb4934

# Green
color2   #98971a
color10  #b8bb26

# Yellow
color3   #d79921
color11  #fabd2f

# Blue (Solarized blue for accent)
color4   #268bd2
color12  #83a598

# Magenta
color5   #b16286
color13  #d3869b

# Cyan (Solarized cyan)
color6   #2aa198
color14  #8ec07c

# White
color7   #a89984
color15  #ebdbb2

# Tab bar
tab_bar_style powerline
tab_bar_edge top
tab_bar_background #1d2021
active_tab_foreground   #282828
active_tab_background   #fabd2f
inactive_tab_foreground #a89984
inactive_tab_background #3c3836

# Mouse
copy_on_select yes

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes